<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="style.css" rel="stylesheet">
    <title>Cadastro | Loja de Artes Marciais</title>
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid justify-content-center">
                <a class="navbar-brand fw-bold" href="index.html">Loja de Artes Marciais</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Menu">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse flex-grow-0 justify-content-center" id="navbarNav">
                    <ul class="navbar-nav text-center">
                        <li class="nav-item"><a class="nav-link" href="index.html">PRODUTOS</a></li>
                        <li class="nav-item"><a class="nav-link" href="carrinho.html">CARRINHO <span id="cart-count" class="badge bg-danger" style="display:none">0</span></a></li>
                        <li class="nav-item"><a class="nav-link" href="compras.html">MINHAS COMPRAS</a></li>
                        <li class="nav-item active" id="nav-login"><a class="nav-link" href="login.html">LOGIN</a></li>
                    </ul>
                    <div class="dropdown m-3">
                        <button id="user-info" class="btn btn-light dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false" style="display:none">Opções</button>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="perfil.html">Meu perfil</a></li>
                            <li><a class="dropdown-item" href="compras.html">Minhas compras</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" onclick="logout()">Sair</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <form id="form_cadastro">
            <h1 class="titulo-pagina">Cadastro</h1>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" required minlength="3" class="input_texto">
            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" placeholder="000.000.000-00" required class="input_texto">
            <label for="celular">Celular:</label>
            <input type="tel" id="celular" placeholder="(99) 99999-9999" required class="input_texto">
            <label for="email">E-mail:</label>
            <input type="email" id="email" required class="input_texto">
            <label for="senha">Senha (mín. 6 caracteres):</label>
            <input type="password" id="senha" required minlength="6" class="input_texto">
            <p class="text-center">Já possui conta? <a href="login.html">Entre aqui</a></p>
            <input type="submit" id="btn_enviar" value="Enviar cadastro" class="btn_enviar">
        </form>
    </main>

    <div class="position-fixed" style="top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1050;">
        <div id="liveToast" class="toast align-items-center text-white bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="4000">
            <div class="d-flex">
                <div class="toast-body" id="toast-message"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Fechar"></button>
            </div>
        </div>
    </div>

    <script src="./pages.js"></script>
    <script src="./api.js"></script>
    <script src="./carrinho.js"></script>
    <script>
        const form = document.getElementById("form_cadastro");
        const btn = document.getElementById("btn_enviar");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            btn.disabled = true;
            btn.value = "Enviando...";

            try {
                await cadastrar_cliente({
                    nome: document.getElementById("nome").value.trim(),
                    cpf: document.getElementById("cpf").value.trim(),
                    celular: document.getElementById("celular").value.trim(),
                    email: document.getElementById("email").value.trim(),
                    senha: document.getElementById("senha").value,
                });
                mostrarToast("✅ Cadastro realizado! Redirecionando para o login...", "bg-success");
                form.reset();
                setTimeout(() => { window.location.href = "login.html"; }, 1800);
            } catch (erro) {
                mostrarToast("❌ " + erro.message, "bg-danger");
                btn.disabled = false;
                btn.value = "Enviar cadastro";
            }
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
