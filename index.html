<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="style.css" rel="stylesheet">
    <title>Produtos | Loja de Artes Marciais</title>
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid justify-content-center">
                <a class="navbar-brand fw-bold" href="index.html">Loja de Artes Marciais</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Menu">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse flex-grow-0 justify-content-center" id="navbarNav">
                    <ul class="navbar-nav text-center">
                        <li class="nav-item"><a class="nav-link" href="index.html">PRODUTOS</a></li>
                        <li class="nav-item">
                            <a class="nav-link" href="carrinho.html">CARRINHO <span id="cart-count" class="badge bg-danger" style="display:none">0</span></a>
                        </li>
                        <li class="nav-item"><a class="nav-link" href="compras.html">MINHAS COMPRAS</a></li>
                        <li class="nav-item active" id="nav-login"><a class="nav-link" href="login.html">LOGIN</a></li>
                    </ul>
                    <div class="dropdown m-3">
                        <button id="user-info" class="btn btn-light dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false" style="display:none">
                            Opções
                        </button>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="perfil.html">Meu perfil</a></li>
                            <li><a class="dropdown-item" href="compras.html">Minhas compras</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" onclick="logout()">Sair</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="pagina-produtos">
        <div id="busca-produtos">
            <form id="form-filtros" onsubmit="event.preventDefault(); carregar_produtos(true)">
                <div class="linha-filtros">
                    <div>
                        <label for="input-busca">Buscar:</label>
                        <input type="text" id="input-busca" class="input_texto" placeholder="Nome, categoria ou descrição">
                    </div>
                    <div>
                        <label for="select-categoria">Categoria:</label>
                        <select id="select-categoria">
                            <option value="">Todas</option>
                            <option value="kimono">Kimono</option>
                            <option value="luva">Luva</option>
                            <option value="protetor">Protetor</option>
                            <option value="faixa">Faixa</option>
                            <option value="acessorio">Acessório</option>
                            <option value="saco">Saco</option>
                            <option value="shorts">Shorts</option>
                            <option value="camiseta">Camiseta</option>
                        </select>
                    </div>
                    <div class="campo-preco">
                        <label for="input-preco-min">Preço mín.:</label>
                        <input type="number" id="input-preco-min" class="input_texto" min="0" step="0.01" placeholder="0,00">
                    </div>
                    <div class="campo-preco">
                        <label for="input-preco-max">Preço máx.:</label>
                        <input type="number" id="input-preco-max" class="input_texto" min="0" step="0.01" placeholder="9999,00">
                    </div>
                    <div>
                        <label for="select-ordem">Ordenar:</label>
                        <select id="select-ordem">
                            <option value="">Sem ordenação</option>
                            <option value="menor preco">Menor preço</option>
                            <option value="maior preco">Maior preço</option>
                            <option value="nome">Nome (A-Z)</option>
                        </select>
                    </div>
                </div>
                <div class="acoes-filtros">
                    <input type="submit" value="Buscar" class="btn_enviar">
                    <button type="button" class="btn btn-outline-secondary" onclick="document.getElementById('form-filtros').reset(); carregar_produtos(true)">Limpar filtros</button>
                </div>
            </form>
        </div>

        <div id="mensagem-produtos"></div>
        <div id="produtos" class="grid-produtos"></div>
    </main>

    <!-- ALERTA TOAST -->
    <div class="position-fixed" style="top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1050;">
        <div id="liveToast" class="toast align-items-center text-white bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="4000">
            <div class="d-flex">
                <div class="toast-body" id="toast-message"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Fechar"></button>
            </div>
        </div>
    </div>

    <script src="./pages.js"></script>
    <script src="./api.js"></script>
    <script src="./carrinho.js"></script>
    <script src="./index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
